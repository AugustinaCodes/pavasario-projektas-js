services:
  postgres:
    image: postgres:16
    container_name: fitbook_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitbook_db
      POSTGRES_USER: fitbook_user
      POSTGRES_PASSWORD: fitbook_password
    ports:
      - "5432:5432"
    volumes:
      - fitbook_postgres_data:/var/lib/postgresql/data

volumes:
  fitbook_postgres_data: